<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 1.5em;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .btn {
            padding: 15px;
            font-size: 1.2em;
            text-align: center;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly />
        <div class="buttons">
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">/</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">*</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">-</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn">=</button>
            <button class="btn">+</button>
            <button class="btn">C</button>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentNumber = ""; // Store the current input number
            let previousNumber = ""; // Store the previous input number
            let operator = ""; // Store the selected operator
            const display = document.getElementById("display");

            // Function to update the display
            function updateDisplay(value) {
                display.value = value;
            }

            // Function to perform calculation
            function calculate() {
                let result = 0;
                const num1 = parseFloat(previousNumber);
                const num2 = parseFloat(currentNumber);

                if (!isNaN(num1) && !isNaN(num2)) {
                    switch (operator) {
                        case "+":
                            result = num1 + num2;
                            break;
                        case "-":
                            result = num1 - num2;
                            break;
                        case "*":
                            result = num1 * num2;
                            break;
                        case "/":
                            result = num1 / num2;
                            break;
                        default:
                            return;
                    }
                    updateDisplay(`${previousNumber} ${operator} ${currentNumber} = ${result}`); // Show the full expression and result
                    previousNumber = result.toString(); // Save result for further calculation
                    currentNumber = ""; // Reset current number
                    operator = ""; // Reset operator
                }
            }

            // Event listener for button clicks
            document.querySelectorAll(".btn").forEach(button => {
                button.addEventListener("click", (e) => {
                    const value = e.target.innerText;

                    if (!isNaN(value) || value === ".") {
                        // Number or decimal point
                        currentNumber += value;
                        updateDisplay(`${previousNumber} ${operator} ${currentNumber}`);
                    } else if (value === "C") {
                        // Clear everything
                        currentNumber = "";
                        previousNumber = "";
                        operator = "";
                        updateDisplay("");
                    } else if (value === "=") {
                        // Perform calculation
                        calculate();
                    } else {
                        // Operator clicked
                        if (currentNumber !== "") {
                            if (previousNumber !== "") {
                                calculate(); // Perform any pending calculation first
                            }
                            previousNumber = currentNumber;
                            currentNumber = "";
                        }
                        operator = value; // Update the operator
                        updateDisplay(`${previousNumber} ${operator}`); // Show operator on display
                    }
                });
            });

            // Event listener for Enter key press
            document.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    if (currentNumber !== "" && operator !== "") {
                        calculate(); // Perform the calculation if an operator is set
                    } else if (currentNumber !== "" && previousNumber === "") {
                        previousNumber = currentNumber; // Move to the next number
                        currentNumber = "";
                        updateDisplay(""); // Clear the display for the next input
                    }
                }
            });
        });
    </script>
</body>
</html>
